<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perissological</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            text-align: center;
        }

        .pfp {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 30px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .pfp:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .display-name {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .languages {
            margin: 30px 0;
        }

        .languages h2 {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 20px;
        }

        .language-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .language-item {
            text-align: center;
            transition: transform 0.3s ease;
        }

        .language-item:hover {
            transform: translateY(-5px);
        }

        .language-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px;
            object-fit: contain;
        }

        .language-name {
            font-size: 0.95em;
            color: #555;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }

        .bio {
            color: #666;
            line-height: 1.6;
            font-size: 1em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .language-grid {
                gap: 15px;
            }

            .language-icon {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://discord.com/users/630438858445815812" title="Open Discord Profile">
            <img src="https://cdn.discordapp.com/avatars/630438858445815812/58457fc43c55b0e1a36901f394ee6e7f.png?size=1024" alt="Perissological" class="pfp">
        </a>

        <h1>Perissological</h1>
        <p class="display-name">peris</p>

        <div class="languages">
            <h2>Languages & Tools</h2>
            <div class="language-grid">
                <div class="language-item">
                    <img src="https://cdn.modrinth.com/data/xFNYAvMk/36620079105b8ee2ec539b24b7d2fde1a6692ccc_96.webp" alt="Skript" class="language-icon">
                    <p class="language-name">Skript</p>
                </div>
                <div class="language-item">
                    <img src="https://raw.githubusercontent.com/devicons/devicon/master/icons/java/java-original.svg" alt="Java" class="language-icon">
                    <p class="language-name">Java</p>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <p class="bio">Passionate developer working with Skript and Java</p>
    </div>
</body>
</html>
